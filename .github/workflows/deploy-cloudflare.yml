# Cloudflare — the app's real home.
#
# Two deployments in order, and the order matters: the Pages project binds to
# the Worker by service name, so the Worker has to exist before Pages can
# resolve the binding on a first deploy.
#
# Requires two repository secrets, CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. Without them the workflow stops at the guard below
# rather than failing every push on a fork or a clone that has no Cloudflare
# account behind it.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # `secrets` is not readable from a job-level `if`, so the check is a job of
  # its own that publishes a plain output the others can gate on.
  configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not set — skipping deploy."
          fi

  worker:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm --prefix backend ci

      # Migrations before the deploy: a Worker that is live against a schema it
      # expects and does not have is a broken sign-in, and D1 migrations here
      # only ever add.
      - name: Apply D1 migrations
        run: npm --prefix backend run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npm --prefix backend run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pages:
    needs: [configured, worker]
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # No BASE_PATH: Cloudflare serves the app at the root, which is the
      # default in astro.config.mjs.
      - run: npm run build

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --functions-directory is explicit: the proxy in functions/ lives at
          # the repo root, not inside dist/, and losing it would deploy a
          # frontend that quietly falls back to the free tier.
          command: >-
            pages deploy dist
            --project-name=bottlecount
            --branch=main
            --functions-directory=functions
