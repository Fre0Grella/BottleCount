# GitHub Pages — documentation and the public showcase.
#
# The app's home is Cloudflare Pages (see deploy-cloudflare.yml). This build is
# the same source served under the repository's path prefix, which is why
# BASE_PATH is set here and defaults to "/" everywhere else: hard-coding either
# root in astro.config.mjs would break the other host.
#
# There is no backend behind this deployment, and that is fine by design — the
# Pages Functions proxy is absent, /api/session is unreachable, and the app
# settles on the free, browser-only tier.
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          package-manager: 'npm'
          node-version: 22
        env:
          BASE_PATH: /BottleCount/
          SITE: https://fre0grella.github.io

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
