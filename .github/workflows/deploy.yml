# GitHub Pages — the documentation site.
#
# This is *not* the application. The app lives on Cloudflare Pages, where the
# Worker is (see deploy-cloudflare.yml), and both tiers are served from there:
# free users get it without an account, paying users sign in.
#
# What this deploys is the landing page, the docs, pricing and the legal pages,
# under the repository's path prefix. `BUILD_TARGET=docs` deletes /app,
# /auth and /i from the output, because every one of them needs the Worker and
# there is none behind this host — a half-working copy of the product is worse
# than no copy. Links to the app here point at the real one via PUBLIC_APP_URL.
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          package-manager: 'npm'
          node-version: 22
        env:
          BUILD_TARGET: docs
          BASE_PATH: /BottleCount/
          SITE: https://fre0grella.github.io
          # Where "Open app" and the pricing CTAs point from the docs site.
          PUBLIC_APP_URL: https://bottlecount.pages.dev/app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
